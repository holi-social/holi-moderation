default_install_hook_types:
  - pre-commit

default_stages:
  - pre-commit

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        name: gitleaks - detect hardcoded secrets
        args: ["-c", "../.gitleaks.toml"]

  - repo: local
    hooks:
      - id: eslint-holi-moderation
        name: lint packages
        language: system
        entry: bash -c ". $HOME/.nvm/nvm.sh && corepack yarn run lint"
        pass_filenames: false
        always_run: true

  - repo: https://github.com/AleksaC/terraform-py
    rev: v1.9.0
    hooks:
      - id: tf-fmt
      - id: tf-validate

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        args: ['--unsafe']

  - repo: git@gitlab-holi:app/holi-meta.git
    rev: 6f2fe467b05362ba73936969f325eb87e291d85b
    hooks:
      - id: scan-comments
        name: scan-comments
        entry: ../scripts/scan-comments.sh .
        language: system
        pass_filenames: true
        always_run: true
        verbose: true
      - id: security-checks
        name: security-checks
        entry: ../scripts/security-checks.sh .
        language: system
        pass_filenames: true
        always_run: true
        verbose: true
