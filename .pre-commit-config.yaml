default_install_hook_types:
  - pre-commit

default_stages:
  - pre-commit

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        name: gitleaks - detect hardcoded secrets
        args: ["-c", "../.gitleaks.toml"]

  - repo: local
    hooks:
      - id: eslint-holi-moderation
        name: lint packages
        language: system
        entry: bash -c ". $HOME/.nvm/nvm.sh && corepack yarn run lint"
        pass_filenames: false
        always_run: true

  - repo: https://github.com/AleksaC/terraform-py
    rev: v1.9.0
    hooks:
      - id: tf-fmt
      - id: tf-validate

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        args: ['--unsafe']
