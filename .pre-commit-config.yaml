default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        language: system
        entry: gitleaks protect --staged -v -c ../.gitleaks.toml
        pass_filenames: false
        always_run: true

      - id: eslint-frontend
        name: eslint frontend
        language: system
        entry: bash -c ". $HOME/.nvm/nvm.sh && yarn workspace @holi/moderation-frontend eslint --fix src"
        pass_filenames: false
        always_run: true

      - id: eslint-backend
        name: eslint backend
        language: system
        entry: bash -c ". $HOME/.nvm/nvm.sh && yarn workspace @holi/moderation-backend eslint --fix src"
        pass_filenames: false
        always_run: true

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint

  - repo: https://github.com/AleksaC/terraform-py
    rev: v1.9.0
    hooks:
      - id: tf-fmt
      - id: tf-validate
