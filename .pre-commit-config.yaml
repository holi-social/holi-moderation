default_install_hook_types:
  - pre-commit
  - commit-msg

default_stages:
  - pre-commit

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        name: gitleaks - detect hardcoded secrets
        args: ["-c", "../.gitleaks.toml"]

  - repo: local
    hooks:
      - id: eslint-frontend
        name: lint frontend
        language: system
        entry: bash -c ". $HOME/.nvm/nvm.sh && yarn workspace @holi/moderation-frontend eslint --fix src"
        pass_filenames: false
        always_run: true

      - id: eslint-backend
        name: lint backend
        language: system
        entry: bash -c ". $HOME/.nvm/nvm.sh && yarn workspace @holi/moderation-backend eslint --fix src"
        pass_filenames: false
        always_run: true

      - id: eslint-event-listener
        name: lint event listener
        language: system
        entry: bash -c ". $HOME/.nvm/nvm.sh && yarn workspace @holi/moderation-event-listener eslint --fix src"
        pass_filenames: false
        always_run: true

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint
        name: lint commit message

  - repo: https://github.com/AleksaC/terraform-py
    rev: v1.9.0
    hooks:
      - id: tf-fmt
      - id: tf-validate

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
