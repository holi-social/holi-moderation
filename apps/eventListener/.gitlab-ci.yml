event_listener:lint:
  stage: lint
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/node:20.11-alpine'
  before_script:
    - corepack enable
    - yarn install
    - yarn workspace @holi/moderation-event-listener install
  script:
    - yarn workspace @holi/moderation-event-listener run lint

event_listener:test:
  stage: test
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/node:20.11-alpine'

  needs:
    - "event_listener:lint"

  before_script:
    - corepack enable
    - yarn workspace @holi/moderation-event-listener install
  script:
    - yarn workspace @holi/moderation-event-listener run test
