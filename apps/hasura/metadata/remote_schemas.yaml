- name: moderation
  definition:
    url: '{{BACKEND_GRAPHQL_URL}}'
    timeout_seconds: 60
    customization: {}
    forward_client_headers: true
  comment: ""
  permissions:
    - role: anonymous
      definition:
        schema: |
          schema {
            query: Query
            mutation: Mutation
          }
          scalar UUID
          type AuthResult {
            email: String!
            token: String!
            userId: UUID!
          }
          type Mutation {
            login(email: String!, password: String!): AuthResult!
          }
          type Query {
            verifyToken: TokenValidity!
          }
          type TokenValidity {
            valid: Boolean!
          }
    - role: moderator
      definition:
        schema: |
          schema {
            query: Query
            mutation: Mutation
          }
          scalar DateTime
          scalar JSONObject
          scalar UUID
          type ActionResult {
            success: Boolean!
          }
          type AuthResult {
            email: String!
            token: String!
            userId: UUID!
          }
          type Mutation {
            banUser(reason: String!, userId: UUID!): ActionResult!
            changeReportStatus(newStatus: ReportStatus!, reportId: UUID!): Report!
            createReport(report: CreateReport!): Report!
            login(email: String!, password: String!): AuthResult!
          }
          type Query {
            report(id: UUID!): Report!
            reports: [Report!]!
            verifyToken: TokenValidity!
          }
          type Report {
            contentId: UUID!
            contentType: ContentType!
            createdAt: DateTime!
            details: String!
            events: [ReportEvent!]!
            id: UUID!
            reporterId: UUID!
            status: ReportStatus!
            updatedAt: DateTime!
          }
          type ReportEvent {
            eventName: ReportLogEvent!
            eventPayload: JSONObject!
            id: UUID!
            occurredAt: DateTime!
          }
          type TokenValidity {
            valid: Boolean!
          }
          enum ContentType {
            CHAT_MESSAGE
            COMMENT
            POST
            SPACE
            SPACE_APPOINTMENT
            SPACE_LINKHUB_TOOL
            SPACE_TASK
            USER
          }
          enum ReportLogEvent {
            REPORT_CREATED
            STATUS_CHANGED
          }
          enum ReportStatus {
            ACTION_TAKEN
            IN_PROGRESS
            OPEN
            REJECTED
          }
          input CreateReport {
            contentId: UUID!
            contentType: ContentType!
            details: String!
            reporterId: UUID!
          }
  remote_relationships:
    - relationships:
        - definition:
            to_source:
              field_mapping:
                reporterId: id
              relationship_type: object
              source: okuna
              table:
                name: openbook_auth_user
                schema: public
          name: reporter
        - definition:
            to_source:
              field_mapping:
                contentId: id
              relationship_type: object
              source: okuna
              table:
                name: openbook_posts_post
                schema: public
          name: reportedPost
        - definition:
            to_source:
              field_mapping:
                contentId: id
              relationship_type: object
              source: okuna
              table:
                name: openbook_posts_postcomment
                schema: public
          name: reportedComment
        - definition:
            to_source:
              field_mapping:
                contentId: id
              relationship_type: object
              source: okuna
              table:
                name: openbook_auth_user
                schema: public
          name: reportedUser
        - definition:
            to_source:
              field_mapping:
                contentId: id
              relationship_type: object
              source: okuna
              table:
                name: openbook_communities_community
                schema: public
          name: reportedSpace
        - definition:
            to_source:
              field_mapping:
                contentId: id
              relationship_type: object
              source: okuna
              table:
                name: openbook_appointments_appointment
                schema: public
          name: reportedSpaceAppointment
        - definition:
            to_source:
              field_mapping:
                contentId: id
              relationship_type: object
              source: okuna
              table:
                name: openbook_communities_task
                schema: public
          name: reportedSpaceTask
        - definition:
            to_source:
              field_mapping:
                contentId: id
              relationship_type: object
              source: okuna
              table:
                name: openbook_communities_collaborationtool
                schema: public
          name: reportedSpaceLinkhubTool
      type_name: Report
