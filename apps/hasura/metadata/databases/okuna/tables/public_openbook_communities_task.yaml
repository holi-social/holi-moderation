table:
  name: openbook_communities_task
  schema: public
object_relationships:
  - name: creator
    using:
      foreign_key_constraint_on: creator_id
  - name: space
    using:
      foreign_key_constraint_on: community_id
array_relationships:
  - name: skills
    using:
      foreign_key_constraint_on:
        column: task_id
        table:
          name: openbook_communities_task_skills
          schema: public
select_permissions:
  - role: moderator
    permission:
      columns:
        - geolocation
        - contact_email
        - contact_phone
        - location
        - location_type
        - name
        - regularity
        - thumbnail
        - thumbnail_blurhash
        - visibility
        - slots_available
        - slots_taken
        - description
        - created
        - community_id
        - creator_id
        - id
      filter: {}
      allow_aggregations: true
    comment: ""
