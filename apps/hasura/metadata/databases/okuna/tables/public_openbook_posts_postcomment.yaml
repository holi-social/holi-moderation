table:
  name: openbook_posts_postcomment
  schema: public
object_relationships:
  - name: commentableType
    using:
      foreign_key_constraint_on: commentable_type_id
  - name: commenter
    using:
      foreign_key_constraint_on: commenter_id
  - name: parentComment
    using:
      foreign_key_constraint_on: parent_comment_id
array_relationships:
  - name: childComments
    using:
      foreign_key_constraint_on:
        column: parent_comment_id
        table:
          name: openbook_posts_postcomment
          schema: public
select_permissions:
  - role: moderator
    permission:
      columns:
        - is_deleted
        - is_edited
        - commentable_type_id
        - text
        - created
        - modified
        - commentable_id
        - commenter_id
        - id
        - language_id
        - parent_comment_id
      filter: {}
      allow_aggregations: true
    comment: ""
