table:
  name: openbook_auth_userprofile
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
select_permissions:
  - role: moderator
    permission:
      columns:
        - geolocation
        - community_posts_visible
        - followers_count_visible
        - is_of_legal_age
        - avatar
        - avatar_blurhash
        - engagement_level
        - geolocation_id
        - last_name
        - location
        - name
        - pronouns
        - url
        - about_me
        - id
        - user_id
      filter: {}
      allow_aggregations: true
    comment: ""
