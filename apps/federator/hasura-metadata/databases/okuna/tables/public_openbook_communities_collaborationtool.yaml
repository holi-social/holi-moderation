table:
  name: openbook_communities_collaborationtool
  schema: public
object_relationships:
  - name: creator
    using:
      foreign_key_constraint_on: creator_id
  - name: space
    using:
      foreign_key_constraint_on: community_id
select_permissions:
  - role: moderator
    permission:
      columns:
        - collection_type
        - description
        - domain
        - thumbnail
        - thumbnail_blurhash
        - title
        - url
        - created_at
        - community_id
        - creator_id
        - id
      filter: {}
      allow_aggregations: true
    comment: ""
