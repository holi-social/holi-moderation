table:
  name: openbook_auth_user
  schema: public
object_relationships:
  - name: profile
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: openbook_auth_userprofile
          schema: public
array_relationships:
  - name: comments
    using:
      foreign_key_constraint_on:
        column: commenter_id
        table:
          name: openbook_posts_postcomment
          schema: public
  - name: createdAppointments
    using:
      foreign_key_constraint_on:
        column: creator_id
        table:
          name: openbook_appointments_appointment
          schema: public
  - name: createdLinkhubTools
    using:
      foreign_key_constraint_on:
        column: creator_id
        table:
          name: openbook_communities_collaborationtool
          schema: public
  - name: createdSpaces
    using:
      foreign_key_constraint_on:
        column: creator_id
        table:
          name: openbook_communities_community
          schema: public
  - name: createdTasks
    using:
      foreign_key_constraint_on:
        column: creator_id
        table:
          name: openbook_communities_task
          schema: public
  - name: posts
    using:
      foreign_key_constraint_on:
        column: creator_id
        table:
          name: openbook_posts_post
          schema: public
select_permissions:
  - role: moderator
    permission:
      columns:
        - are_guidelines_accepted
        - connections_circle_id
        - date_joined
        - email
        - id
        - identity
        - invite_count
        - is_active
        - is_deleted
        - is_email_verified
        - is_moderator
        - is_staff
        - is_superuser
        - last_login
        - last_seen_notification_timestamp
        - tracking_consent_analytics
        - tracking_consent_personalization
        - username
        - visibility
      filter: {}
      allow_aggregations: true
    comment: ""
