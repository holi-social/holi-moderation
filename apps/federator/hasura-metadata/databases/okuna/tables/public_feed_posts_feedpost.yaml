table:
  name: feed_posts_feedpost
  schema: public
object_relationships:
  - name: creator
    using:
      manual_configuration:
        column_mapping:
          creator_id: id
        insertion_order: null
        remote_table:
          name: openbook_auth_user
          schema: public
select_permissions:
  - role: moderator
    permission:
      columns:
        - geolocation
        - image
        - image_blurhash
        - language_code
        - location
        - slug
        - title
        - visibility
        - priority_duration
        - description
        - created_at
        - category_id
        - creator_id
        - id
        - link_preview_id
      filter: {}
      allow_aggregations: true
    comment: ""
