- name: moderation
  definition:
    url: '{{BACKEND_GRAPHQL_URL}}'
    timeout_seconds: 60
    customization: {}
    forward_client_headers: true
  comment: ""
  permissions:
    - role: moderator
      definition:
        schema: |
          schema {
            query: Query
            mutation: Mutation
          }
          scalar DateTime
          scalar JSONObject
          scalar UUID
          type AuthResult {
            email: String!
            token: String!
            userId: UUID!
          }
          type Mutation {
            changeOwnPassword(newPassword: String!): Success!
            changeReportStatus(newStatus: ReportStatus!, reportId: UUID!): Report!
            login(email: String!, password: String!): AuthResult!
            suspendUser(duration: Int, email: String!, reason: String, reportId: UUID!): Success!
          }
          type Query {
            isUserSuspended(email: String!): Boolean!
            report(id: UUID!): Report!
            reports(filter: ReportsFilter, pagination: Pagination): [Report!]!
            users(pagination: Pagination): [User!]!
            verifyToken: TokenValidity!
          }
          type Report {
            contentId: UUID!
            contentType: ContentType!
            createdAt: DateTime!
            details: String!
            events: [ReportEvent!]!
            id: UUID!
            reporterId: UUID!
            status: ReportStatus!
            updatedAt: DateTime!
          }
          type ReportEvent {
            actor: User
            eventName: ReportLogEvent!
            eventPayload: JSONObject!
            id: UUID!
            occurredAt: DateTime!
            report: Report!
          }
          type Success {
            success: Boolean!
          }
          type TokenValidity {
            valid: Boolean!
          }
          type User {
            createdAt: DateTime!
            email: String!
            id: UUID!
            role: UserRole!
            updatedAt: DateTime!
          }
          enum ContentType {
            CHAT_MESSAGE
            COMMENT
            FEED_POST
            POST
            SPACE
            SPACE_APPOINTMENT
            SPACE_LINKHUB_TOOL
            SPACE_TASK
            USER
          }
          enum ReportLogEvent {
            REPORT_CREATED
            STATUS_CHANGED
            USER_SUSPENDED
          }
          enum ReportStatus {
            ACTION_TAKEN
            IN_PROGRESS
            OPEN
            REJECTED
          }
          enum UserRole {
            ADMIN
            MODERATOR
          }
          input Pagination {
            limit: Int! = 10
            offset: Int! = 0
          }
          input ReportsFilter {
            reporter: UUID
            search: String
            status: ReportStatus
          }
    - role: anonymous
      definition:
        schema: |
          schema {
            query: Query
            mutation: Mutation
          }
          scalar UUID
          type AuthResult {
            email: String!
            token: String!
            userId: UUID!
          }
          type Mutation {
            login(email: String!, password: String!): AuthResult!
          }
          type Query {
            verifyToken: TokenValidity!
          }
          type TokenValidity {
            valid: Boolean!
          }
  remote_relationships:
    - relationships:
        - definition:
            to_source:
              field_mapping:
                reporterId: username
              relationship_type: object
              source: okuna
              table:
                name: openbook_auth_user
                schema: public
          name: reporter
        - definition:
            to_source:
              field_mapping:
                contentId: id
              relationship_type: object
              source: okuna
              table:
                name: openbook_posts_post
                schema: public
          name: reportedPost
        - definition:
            to_source:
              field_mapping:
                contentId: id
              relationship_type: object
              source: okuna
              table:
                name: openbook_posts_postcomment
                schema: public
          name: reportedComment
        - definition:
            to_source:
              field_mapping:
                contentId: username
              relationship_type: object
              source: okuna
              table:
                name: openbook_auth_user
                schema: public
          name: reportedUser
        - definition:
            to_source:
              field_mapping:
                contentId: id
              relationship_type: object
              source: okuna
              table:
                name: openbook_communities_community
                schema: public
          name: reportedSpace
        - definition:
            to_source:
              field_mapping:
                contentId: id
              relationship_type: object
              source: okuna
              table:
                name: openbook_appointments_appointment
                schema: public
          name: reportedSpaceAppointment
        - definition:
            to_source:
              field_mapping:
                contentId: id
              relationship_type: object
              source: okuna
              table:
                name: openbook_communities_task
                schema: public
          name: reportedSpaceTask
        - definition:
            to_source:
              field_mapping:
                contentId: id
              relationship_type: object
              source: okuna
              table:
                name: openbook_communities_collaborationtool
                schema: public
          name: reportedSpaceLinkhubTool
        - definition:
            to_source:
              field_mapping:
                contentId: id
              relationship_type: object
              source: okuna
              table:
                name: feed_posts_feedpost
                schema: public
          name: reportedFeedPost
      type_name: Report
