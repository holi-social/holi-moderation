services:
  backend:
    image: node:22-slim
    user: "node"
    working_dir: /home/node/app
    volumes:
      - ./:/home/node/app
    env_file:
      - .env
    environment:
      PORT: "3001" # dont clash with web app nextjs
      NODE_ENV: development
      LISTEN_ADDR: "0.0.0.0"
      DEBUG: "true"
    healthcheck:
      # check if the node process on tcp port 3001 -> 0BB9 in hex is open
      test: [ "CMD-SHELL", "grep -E ':'$$(printf '%04X\n' 3001) /proc/net/tcp" ]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 3001:3001
    restart: no
    # installs deps for the linux arch as the local node_modules might be for mac
    command: sh -c "corepack yarn install; corepack yarn workspace @holi/moderation-backend nest start --watch"

  frontend:
    image: node:22-slim
    user: "node"
    working_dir: /home/node/app
    volumes:
      - ./:/home/node/app
    environment:
      VITE_OKUNA_ADMIN_BASE_URL: "http://localhost:8000/local/admin"
      VITE_GRAPHQL_URL: "http://localhost:8080/v1/graphql"
      # the admin secret should NEVER be added to the deployed container, only locally to facilitate schema introspection for codegen
      HASURA_GRAPHQL_ADMIN_SECRET: "${HASURA_GRAPHQL_ADMIN_SECRET}"
      INTERNAL_GRAPHQL_URL: "http://hasura:8080/v1/graphql"
    ports:
      - 5173:5173
    # installs deps for the linux arch as the local node_modules might be for mac
    command: sh -c "corepack yarn install; corepack yarn workspace @holi/moderation-frontend dev"

  db:
    image: postgres:17
    restart: no
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./apps/federator/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_USER: ${MODERATION_DB_USER}
      POSTGRES_PASSWORD: ${MODERATION_DB_PASSWORD}
      POSTGRES_DB: ${MODERATION_DB_NAME}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
      PGPORT: ${MODERATION_DB_PORT}
    ports:
      - ${MODERATION_DB_PORT}:${MODERATION_DB_PORT}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d ${MODERATION_DB_NAME} -U ${MODERATION_DB_USER}" ]
      interval: 3s
      timeout: 5s
      retries: 30

  federator:
    image: hasura/graphql-engine:v2.45.2.cli-migrations-v3.ubi
    ports:
      - "8080:8080"
    restart: no
    volumes:
      - ./apps/federator/hasura-metadata:/hasura-metadata
    environment:
      ## enable the console served by server
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true" # set to "false" to disable console
      ## enable debugging mode. It is recommended to disable this in production
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, webhook-log, websocket-log, query-log
      ## uncomment next line to run console offline (i.e load console assets from server instead of CDN)
      # HASURA_GRAPHQL_CONSOLE_ASSETS_DIR: /srv/console-assets
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET}
      HASURA_GRAPHQL_ENABLE_REMOTE_SCHEMA_PERMISSIONS: "true"
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: "anonymous"
      HASURA_GRAPHQL_EXPERIMENTAL_FEATURES: "naming_convention"
      # runtime secrets
      HASURA_GRAPHQL_JWT_SECRET: "{\"type\": \"HS256\", \"key\": \"${MODERATION_JWT_SECRET}\"}"
      HASURA_GRAPHQL_METADATA_DATABASE_URL: "postgres://${MODERATION_DB_USER}:${MODERATION_DB_PASSWORD}@${MODERATION_DB_HOST}:${MODERATION_DB_PORT}/${MODERATION_DB_NAME}"
      OKUNA_DATABASE_URL: "postgres://${OKUNA_DB_USER}:${OKUNA_DB_PASSWORD}@${OKUNA_DB_HOST}:${OKUNA_DB_PORT}/${OKUNA_DB_NAME}"
      ## Federated data sources
      BACKEND_GRAPHQL_URL: "http://backend:3001/graphql"

    depends_on:
      backend:
        condition: service_healthy
      db:
        condition: service_healthy

  pubsub:
    image: eu.gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: "gcloud beta emulators pubsub start --project=${PUBSUB_PROJECT_ID} --host-port=0.0.0.0:8085"
    ports:
      - "8085:8085"

volumes:
  db_data:

