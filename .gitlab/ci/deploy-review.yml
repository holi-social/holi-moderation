include:
  - local: ".gitlab/ci/deploy.yml"

deploy:review:infra:
  extends: .deploy_infra
  environment:
    name: review-$CI_COMMIT_REF_SLUG
    url: https://$CI_COMMIT_REF_SLUG.moderation.holi.social
    on_stop: "deploy:review:stop"
    auto_stop_in: 1 week
  when: manual
  except:
    - main
    - production

deploy:review:hasura_metadata:
  extends: .deploy_hasura_metadata
  dependencies:
    - "deploy:review:infra"
  needs:
    - "deploy:review:infra"
  except:
    - main
    - production

deploy:review:db_migrations:
  extends: .run_db_migrations
  dependencies:
    - "deploy:review:infra"
  needs:
    - "deploy:review:infra"
  except:
    - main
    - production

deploy:review:stop:
  stage: destroy
  image:
    name: "hashicorp/terraform:1.6.1"
    entrypoint: ["/bin/sh", "-c"]

  variables:
    GIT_STRATEGY: none

  environment:
    name: review-$CI_COMMIT_REF_SLUG
    action: stop

  dependencies: []
  script:
    - export GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_CLOUD_SERVICE_ACCOUNT}
    - git clone $CI_REPOSITORY_URL main-clone
    - cd main-clone
    - git switch $CI_COMMIT_BRANCH || true
    - terraform/environments/scripts/destroy-env.sh $CI_ENVIRONMENT_NAME
  when: manual
  allow_failure: false
  except:
    - main
    - production
    - /^noenv.+/
  resource_group: $CI_ENVIRONMENT_NAME
  interruptible: false
