apps:lint:
  stage: lint
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/node:20.11-alpine'
  before_script:
    - corepack enable
    - corepack yarn install --immutable --immutable-cache
  script:
    - corepack yarn lint
  rules:
    - if: $CI_COMMIT_BRANCH
      changes: 
      - yarn.lock
