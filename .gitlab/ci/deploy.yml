.deploy_infra:
  stage: deploy
  image:
    name: "europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/hashicorp/terraform:1.6.1"
    entrypoint: ["/bin/sh", "-c"]
  variables:
    ENVIRONMENT_ID: $CI_ENVIRONMENT_NAME

  needs:
    - "backend:build"
    - "frontend:build"
    - "event_listener:test"
    - "hasura:build"

  artifacts:
    paths:
      - "terraform/environments/crash.log"
      - "terraform/environments/terraform-*.log"
    name: "${CI_JOB_NAME}_${CI_JOB_ID}"
    expire_in: 1 week

  script:
    - terraform/environments/scripts/create-or-update-env.sh $ENVIRONMENT_ID $CI_COMMIT_SHA

  resource_group: $ENVIRONMENT_ID
  interruptible: false
  allow_failure: false
