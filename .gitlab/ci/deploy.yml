###
# JOB TEMPLATE
###

.deploy_infra:
  stage: deploy
  image:
    name: "europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/hashicorp/terraform:1.6.6"
    entrypoint: ["/bin/sh", "-c"]
  variables:
    ENVIRONMENT_ID: $CI_ENVIRONMENT_NAME

  needs:
    - "apps:build"
    - "backend:image"
    - "frontend:image"
    - "federator:image"

  artifacts:
    paths:
      - "terraform/environments/crash.log"
      - "terraform/environments/terraform-*.log"
    name: "${CI_JOB_NAME}_${CI_JOB_ID}"
    expire_in: 1 week

  script:
    - terraform/environments/scripts/create-or-update-env.sh $ENVIRONMENT_ID $CI_COMMIT_SHA

  resource_group: $ENVIRONMENT_ID
  interruptible: false
  allow_failure: false

###
# REVIEW ENVIRONMENTS
###

deploy:review:infra:
  extends: .deploy_infra
  environment:
    name: review-$CI_COMMIT_REF_SLUG
    url: https://$CI_COMMIT_REF_SLUG.moderation.holi.social
    on_stop: "deploy:review:stop"
    auto_stop_in: 1 week
  when: manual
  except:
    - main
    - production

deploy:review:stop:
  stage: destroy
  image:
    name: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/hashicorp/terraform:1.6.6'
    entrypoint: ["/bin/sh", "-c"]

  variables:
    GIT_STRATEGY: none

  environment:
    name: review-$CI_COMMIT_REF_SLUG
    action: stop

  dependencies: []
  script:
    - git clone $CI_REPOSITORY_URL main-clone
    - cd main-clone
    - git switch $CI_COMMIT_BRANCH || true
    - terraform/environments/scripts/destroy-env.sh $CI_ENVIRONMENT_NAME
  when: manual
  allow_failure: false
  except:
    - main
    - production
    - /^noenv.+/
  resource_group: $CI_ENVIRONMENT_NAME
  interruptible: false

###
# STAGING
###

deploy:staging:infra:
  extends: .deploy_infra
  environment:
    name: staging
    url: https://staging.moderation.holi.social
  only:
    - main

###
# PRODUCTION
###

deploy:production:infra:
  extends: .deploy_infra
  environment:
    name: production
    url: https://moderation.holi.social
  only:
    - production