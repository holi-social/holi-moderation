.deploy_infra:
  stage: deploy
  image:
    name: hashicorp/terraform:1.6.1
    entrypoint: ["/bin/sh", "-c"]
  variables:
    ENVIRONMENT_ID: $CI_ENVIRONMENT_NAME

  needs:
    - "backend:build"
    - "frontend:build"

  artifacts:
    paths:
      - "terraform/environments/crash.log"
      - "terraform/environments/terraform-*.log"
      - ".env"
    name: "${CI_JOB_NAME}_${CI_JOB_ID}"
    expire_in: "30 days"

  script:
    - terraform/environments/scripts/create-or-update-env.sh $ENVIRONMENT_ID $CI_COMMIT_SHA

    - cd terraform/environments
    - export HASURA_GRAPHQL_ENDPOINT="https://$(terraform output -raw hasura_domain)"
    - export MIGRATION_JOB_NAME="$(terraform output -raw migration_job_name)"
    - export PROJECT_ID="$(terraform output -raw project_id)"

    - cd ../..
    - echo -e "export HASURA_GRAPHQL_ENDPOINT=${HASURA_GRAPHQL_ENDPOINT}\nexport MIGRATION_JOB_NAME=${MIGRATION_JOB_NAME}\nexport PROJECT_ID=${PROJECT_ID}" > .env

  resource_group: $ENVIRONMENT_ID
  interruptible: false
  allow_failure: false

.deploy_hasura_metadata:
  stage: deploy
  image: google/cloud-sdk:477.0.0-slim
  variables:
    HASURA_GRAPHQL_ENABLE_TELEMETRY: "false"

  script:
    - gcloud auth activate-service-account --key-file=$GOOGLE_APPLICATION_CREDENTIALS

    - . .env
    - '[ "$CI_ENVIRONMENT_NAME" == "production" ] && export HASURA_ADMIN_SECRET_NAME="MODERATION_HASURA_ADMIN_SECRET_PRODUCTION" || export HASURA_ADMIN_SECRET_NAME="MODERATION_HASURA_ADMIN_SECRET_DEVELOPMENT"'
    - export HASURA_GRAPHQL_ADMIN_SECRET=$(gcloud secrets versions access latest --secret="${HASURA_ADMIN_SECRET_NAME}")

    - curl -sSLo /usr/local/bin/hasura https://github.com/hasura/graphql-engine/releases/download/v2.39.1/cli-hasura-linux-amd64 && chmod +x /usr/local/bin/hasura
    - cd apps/hasura
    - hasura metadata apply

.migrate:
  stage: deploy
  image: google/cloud-sdk:477.0.0-slim

  script:
    - gcloud auth activate-service-account --key-file=$GOOGLE_APPLICATION_CREDENTIALS
    - . .env
    - gcloud run jobs execute "${MIGRATION_JOB_NAME}" --wait --project="${PROJECT_ID}" --region=europe-north1

  interruptible: false
