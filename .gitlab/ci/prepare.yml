apps:prepare:
  stage: prepare
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/node:20.11-alpine'
  cache: !reference [.yarn-cache-rw]
  before_script:
    - corepack enable
  script:
    - corepack yarn install --immutable
  rules:
    - if: $CI_COMMIT_BRANCH
      changes: 
      - ../../yarn.lock
      - ../../build.trigger
