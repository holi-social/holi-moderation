variables:
  YARN_CACHE_FOLDER: '$CI_PROJECT_DIR/.yarn/cache'
  YARN_ENABLE_GLOBAL_CACHE: 'false'

.yarn-cache-rw:
  key:
    files:
      - yarn.lock
  paths:
    - .yarn/
  policy: pull-push

.yarn-cache-readonly:
  key:
    files:
      - yarn.lock
  paths:
    - .yarn/
  policy: pull

default:
  tags:
    - 1cpu-4gb # default small, configure more explicitly on specific jobs
  before_script:
    - set -e
    # DANGER don't use `set -x` or print the environment via e.g. `env` in pipeline runs, this might leak credentials (has leaked them)

stages:
  - prepare
  - lint
  - test
  - build
  - deploy
  - destroy

include:
  - local: '.gitlab/ci/prepare.yml'
  - local: '.gitlab/ci/lint.yml'
  - local: '.gitlab/ci/test.yml'
  - local: '.gitlab/ci/build.yml'
  - local: 'apps/backend/.gitlab-ci.yml'
  - local: 'apps/frontend/.gitlab-ci.yml'
  - local: 'apps/federator/.gitlab-ci.yml'
  - local: '.gitlab/ci/deploy.yml'
