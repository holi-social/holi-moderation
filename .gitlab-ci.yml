default:
  cache:
    paths:
      - "node_modules/"

stages:
  - lint
  - test
  - build
  - deploy
  - destroy

include:
  - local: ".gitlab/ci/lint.yml"
  - local: ".gitlab/ci/test.yml"
  - local: ".gitlab/ci/build.yml"
  - local: "apps/backend/.gitlab-ci.yml"
  - local: "apps/frontend/.gitlab-ci.yml"
  - local: "apps/federator/.gitlab-ci.yml"
  - local: ".gitlab/ci/deploy.yml"
