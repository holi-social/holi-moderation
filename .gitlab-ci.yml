default:
  cache:
    paths:
      - "node_modules/"

stages:
  - lint
  - test
  - build
  - deploy
  - destroy

include:
  - local: "apps/backend/.gitlab-ci.yml"
  - local: "apps/frontend/.gitlab-ci.yml"
  - local: "apps/eventListener/.gitlab-ci.yml"
  - local: "apps/hasura/.gitlab-ci.yml"
  - local: ".gitlab/ci/deploy-review.yml"
  - local: ".gitlab/ci/deploy-staging.yml"
  - local: ".gitlab/ci/deploy-production.yml"
